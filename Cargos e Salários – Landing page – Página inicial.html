  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n<\u002Fdiv>\n<figure style=\"flex: 1 1 460px; min-width: 0; margin: 0; background: #1C0A55; border: 1px solid #3A2484; border-radius: 18px; padding: 32px 32px 26px\">\n<figcaption style=\"font-size: 14px; color: #B9AEDD; margin-bottom: 22px\">Faixa mais comum em cada nível (R$ por mês)<\u002Ffigcaption>\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center\">\n<span style=\"font-size: 14px; font-weight: 600; color: #FFFFFF\">Júnior<\u002Fspan>\n<div style=\"position: relative; height: 26px; background: #2A1268; border-radius: 5px\">\n<div style=\"position: absolute; top: 0; bottom: 0; left: 20.00%; width: 13.33%; background: #D3C2FF; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; box-sizing: border-box\"><span style=\"font-size: 12px; font-weight: 600; color: #1A0B4A; white-space: nowrap\">3–5k<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center\">\n<span style=\"font-size: 14px; font-weight: 600; color: #FFFFFF\">Pleno<\u002Fspan>\n<div style=\"position: relative; height: 26px; background: #2A1268; border-radius: 5px\">\n<div style=\"position: absolute; top: 0; bottom: 0; left: 33.33%; width: 20.00%; background: #A884FF; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; box-sizing: border-box\"><span style=\"font-size: 12px; font-weight: 600; color: #1A0B4A; white-space: nowrap\">5–8k<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center\">\n<span style=\"font-size: 14px; font-weight: 600; color: #FFFFFF\">Sênior<\u002Fspan>\n<div style=\"position: relative; height: 26px; background: #2A1268; border-radius: 5px\">\n<div style=\"position: absolute; top: 0; bottom: 0; left: 46.67%; width: 33.33%; background: #8249FC; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; box-sizing: border-box\"><span style=\"font-size: 12px; font-weight: 600; color: #FFFFFF; white-space: nowrap\">7–12k<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center\">\n<span style=\"font-size: 14px; font-weight: 600; color: #FFFFFF\">Especialista<\u002Fspan>\n<div style=\"position: relative; height: 26px; background: #2A1268; border-radius: 5px\">\n<div style=\"position: absolute; top: 0; bottom: 0; left: 66.67%; width: 33.33%; background: #5425C5; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; box-sizing: border-box\"><span style=\"font-size: 12px; font-weight: 600; color: #FFFFFF; white-space: nowrap\">10–15k<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center\">\n<span style=\"font-size: 14px; font-weight: 600; color: #FFFFFF\">Coordenador<\u002Fspan>\n<div style=\"position: relative; height: 26px; background: #2A1268; border-radius: 5px\">\n<div style=\"position: absolute; top: 0; bottom: 0; left: 66.67%; width: 33.33%; background: #FA5D27; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; box-sizing: border-box\"><span style=\"font-size: 12px; font-weight: 600; color: #1A0B4A; white-space: nowrap\">10–15k<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; margin-top: 12px\">\n<span><\u002Fspan>\n<div style=\"display: flex; justify-content: space-between; font-size: 12px; color: #B9AEDD\"><span>0<\u002Fspan><span>3k<\u002Fspan><span>6k<\u002Fspan><span>9k<\u002Fspan><span>12k<\u002Fspan><span>15k<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"niveis\" style=\"background: #FFFFFF; border-top: 1px solid #DDD5F3; border-bottom: 1px solid #DDD5F3\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 32px\">\n<h2 style=\"margin: 0; font-size: 40px; letter-spacing: -0.025em; font-weight: 600\">Cinco níveis, uma palavra para cada<\u002Fh2>\n<p style=\"margin: 14px 0 0; font-size: 18px; color: #3D3560; max-width: 40em\">Cada nível muda o grau de autonomia e o tipo de entrega esperada. Depois do Sênior, a carreira se divide: o Especialista aprofunda a técnica, o Coordenador passa a cuidar de pessoas.<\u002Fp>\n<ol style=\"list-style: none; margin: 44px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px\">\n<li style=\"border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; background: #FBFAFF\">\n<span style=\"width: 36px; height: 8px; border-radius: 4px; background: #D3C2FF\"><\u002Fspan>\n<h3 style=\"margin: 6px 0 0; font-size: 22px; font-weight: 600\">Júnior<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; font-weight: 500; color: #5B1FD0\">Aprendizado<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #3D3560\">Execução assistida, com acompanhamento de pessoas mais experientes.<\u002Fp>\n<\u002Fli>\n<li style=\"border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; background: #FBFAFF\">\n<span style=\"width: 36px; height: 8px; border-radius: 4px; background: #A884FF\"><\u002Fspan>\n<h3 style=\"margin: 6px 0 0; font-size: 22px; font-weight: 600\">Pleno<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; font-weight: 500; color: #5B1FD0\">Autonomia<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #3D3560\">Execução autônoma, propondo melhorias no próprio trabalho.<\u002Fp>\n<\u002Fli>\n<li style=\"border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; background: #FBFAFF\">\n<span style=\"width: 36px; height: 8px; border-radius: 4px; background: #8249FC\"><\u002Fspan>\n<h3 style=\"margin: 6px 0 0; font-size: 22px; font-weight: 600\">Sênior<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; font-weight: 500; color: #5B1FD0\">Referência<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #3D3560\">Execução e estratégia, orientando quem está começando.<\u002Fp>\n<\u002Fli>\n<li style=\"border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; background: #FBFAFF\">\n<span style=\"width: 36px; height: 8px; border-radius: 4px; background: #5425C5\"><\u002Fspan>\n<h3 style=\"margin: 6px 0 0; font-size: 22px; font-weight: 600\">Especialista<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; font-weight: 500; color: #5B1FD0\">Estratégia e inovação<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #3D3560\">Referência técnica da área, sem gestão direta de pessoas.<\u002Fp>\n<\u002Fli>\n<li style=\"border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; background: #FBFAFF\">\n<span style=\"width: 36px; height: 8px; border-radius: 4px; background: #FA5D27\"><\u002Fspan>\n<h3 style=\"margin: 6px 0 0; font-size: 22px; font-weight: 600\">Coordenador<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; font-weight: 500; color: #5B1FD0\">Gestão e aperfeiçoamento<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #3D3560\">Execução, gestão de pessoas e estratégia do time.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<h3 style=\"margin: 64px 0 0; font-size: 24px; font-weight: 600\">O que se espera em cada perfil de atuação<\u002Fh3>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; border-top: 2px solid #1A0B4A\">\n<div style=\"padding: 20px 20px 8px 0\">\n<p style=\"margin: 0; font-weight: 600; font-size: 17px\">Operacional<\u002Fp>\n<ul style=\"margin: 8px 0 0; padding-left: 18px; color: #3D3560\"><li>Foco na meta da operação<\u002Fli><li>Qualidade<\u002Fli><li>Produtividade<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"padding: 20px 20px 8px 0\">\n<p style=\"margin: 0; font-weight: 600; font-size: 17px\">Especialista<\u002Fp>\n<ul style=\"margin: 8px 0 0; padding-left: 18px; color: #3D3560\"><li>Domínio técnico<\u002Fli><li>Autonomia<\u002Fli><li>Execução consistente<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"padding: 20px 20px 8px 0\">\n<p style=\"margin: 0; font-weight: 600; font-size: 17px\">Dono de B.U.<\u002Fp>\n<ul style=\"margin: 8px 0 0; padding-left: 18px; color: #3D3560\"><li>Gestão de pessoas<\u002Fli><li>Gestão de prioridades<\u002Fli><li>Gestão de resultado<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"padding: 20px 20px 8px 0\">\n<p style=\"margin: 0; font-weight: 600; font-size: 17px\">Sócio da holding<\u002Fp>\n<ul style=\"margin: 8px 0 0; padding-left: 18px; color: #3D3560\"><li>Visão macro<\u002Fli><li>Coordenação de squads<\u002Fli><li>Estratégia, validação e visão de negócio<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"areas\" style=\"max-width: 1200px; margin: 0 auto; padding: 88px 32px\">\n<h2 style=\"margin: 0; font-size: 40px; letter-spacing: -0.025em; font-weight: 600\">Cinco áreas de negócio<\u002Fh2>\n<p style=\"margin: 14px 0 0; font-size: 18px; color: #3D3560; max-width: 40em\">Cada cargo pertence a uma área e a um time. A área define o contexto da função; o time, com quem ela trabalha no dia a dia.<\u002Fp>\n<div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 22px; font-weight: 600\">Produto<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #5A5375\">Tecnologia, dados e produto digital. 28 cargos em 8 trilhas.<\u002Fp>\n<p style=\"margin: 14px 0 0; font-size: 13px; color: #5A5375\">Times<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">Operacional, Tech, Tráfego<\u002Fp>\n<p style=\"margin: 10px 0 0; font-size: 13px; color: #5A5375\">Liderança<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">Gino, Murilo<\u002Fp>\n<p style=\"margin: 14px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px\"><a href=\"Cargos-Produto-1.dc.html\" style=\"font-weight: 500\">CRO, Dados e Desenvolvimento Web<\u002Fa><a href=\"Cargos-Produto-2.dc.html\" style=\"font-weight: 500\">Desenvolvimento de Software, Design UX/UI e Infraestrutura<\u002Fa><a href=\"Cargos-Produto-3.dc.html\" style=\"font-weight: 500\">Inteligência Artificial e Produto<\u002Fa><\u002Fp>\n<\u002Fdiv><div style=\"background: #FFFFFF; border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 22px; font-weight: 600\">Performance<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #5A5375\">Mídia, conteúdo, retenção e design. 19 cargos em 6 trilhas.<\u002Fp>\n<p style=\"margin: 14px 0 0; font-size: 13px; color: #5A5375\">Times<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">Operacional, Redação/Conteúdo, Retenção, Tráfego<\u002Fp>\n<p style=\"margin: 10px 0 0; font-size: 13px; color: #5A5375\">Liderança<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">Gino<\u002Fp>\n<p style=\"margin: 14px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px\"><a href=\"Cargos-Performance-1.dc.html\" style=\"font-weight: 500\">Design, Growth e Projetos<\u002Fa><a href=\"Cargos-Performance-2.dc.html\" style=\"font-weight: 500\">Redação e Redes Sociais<\u002Fa><a href=\"Cargos-Performance-3.dc.html\" style=\"font-weight: 500\">Tráfego Pago<\u002Fa><\u002Fp>\n<\u002Fdiv><div style=\"background: #FFFFFF; border: 1px solid #DDD5F3; border-radius: 16px; padding: 24px 22px; display: flex; flex-direction: col : 6px 16px; flex-wrap: wrap\"><a href=\"Cargos-Performance-3.dc.html\" style=\"font-size: 18px; font-weight: 600\">Performance: Tráfego Pago<\u002Fa><span style=\"color: #5A5375\">5 cargos<\u002Fspan><\u002Fli>\n<li style=\"padding: 14px 0; border-bottom: 1px solid #ECE7FA; display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap\"><a href=\"Cargos-Backoffice.dc.html\" style=\"font-size: 18px; font-weight: 600\">Backoffice: Financeiro, RH e Secretariado Executivo<\u002Fa><span style=\"color: #5A5375\">12 cargos<\u002Fspan><\u002Fli>\n<li style=\"padding: 14px 0; border-bottom: 1px solid #ECE7FA; display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap\"><a href=\"Cargos-Broady.dc.html\" style=\"font-size: 18px; font-weight: 600\">Broady: Sucesso do Cliente<\u002Fa><span style=\"color: #5A5375\">4 cargos<\u002Fspan><\u002Fli>\n<li style=\"padding: 14px 0; border-bottom: 1px solid #ECE7FA; display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap\"><a href=\"Cargos-Compliance.dc.html\" style=\"font-size: 18px; font-weight: 600\">Compliance: Qualidade de Mídia<\u002Fa><span style=\"color: #5A5375\">4 cargos<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section id=\"mobilidade\" style=\"max-width: 1200px; margin: 0 auto; padding: 56px 32px 88px\">\n<h2 style=\"margin: 0; font-size: 40px; letter-spacing: -0.025em; font-weight: 600\">Mobilidade entre cargos<\u002Fh2>\n<p style=\"margin: 14px 0 0; font-size: 18px; color: #3D3560; max-width: 40em\">Além de subir na própria trilha, dá para mudar de função. O plano mapeia 104 caminhos entre cargos e classifica cada um pelo esforço da mudança.<\u002Fp>\n<div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DDD5F3; border-radius: 16px; padding: 28px 24px\"><span style=\"font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #D6F2F2; color: #0A6467; white-space: nowrap\">Direta<\u002Fspan>\n<p style=\"margin: 18px 0 0; font-size: 17px\">A maior parte das competências já está presente. A mudança pode acontecer com pouco desenvolvimento adicional.<\u002Fp>\n<p style=\"margin: 16px 0 0; font-size: 15px; color: #5A5375\">64 caminhos no plano<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DDD5F3; border-radius: 16px; padding: 28px 24px\"><span style=\"font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #FFE6DA; color: #A23A10; white-space: nowrap\">Condicionada<\u002Fspan>\n<p style=\"margin: 18px 0 0; font-size: 17px\">Há competências transferíveis, mas é preciso desenvolver conhecimentos técnicos específicos antes da mudança.<\u002Fp>\n<p style=\"margin: 16px 0 0; font-size: 15px; color: #5A5375\">40 caminhos no plano<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DDD5F3; border-radius: 16px; padding: 28px 24px\"><span style=\"font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #E9E1FF; color: #4A1FB5; white-space: nowrap\">Nova Trilha<\u002Fspan>\n<p style=\"margin: 18px 0 0; font-size: 17px\">A mudança exige formação ou experiência substancialmente diferente da atual.<\u002Fp>\n<p style=\"margin: 16px 0 0; font-size: 15px; color: #5A5375\">Avaliada caso a caso<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 28px 0 0; font-size: 17px\"><a href=\"Mobilidade.dc.html\" style=\"font-weight: 600\">Ver os 104 caminhos, de qual cargo para qual<\u002Fa><\u002Fp>\n<\u002Fsection>\n<footer style=\"background: #1A0B4A; color: #EDE5FE\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 48px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center\">\n<div>\n<p style=\"margin: 0; font-size: 22px; font-weight: 600; color: #FFFFFF\">Quer conversar sobre a sua trilha?<\u002Fp>\n<p style=\"margin: 6px 0 0; font-size: 16px\">Procure sua liderança ou o time de RH: [contato do RH].<\u002Fp>\n<\u002Fdiv>\n<img src=\"509adcf3-62bc-4f7a-8e24-def67f5e6024\" alt=\"Matter\" style=\"height: 30px; width: auto; display: block\">\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7828}}\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
